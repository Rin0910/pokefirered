name: Build Pokefirered ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y make git gcc-arm-none-eabi libpng-dev

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload Finished GBA ROM
        uses: actions/artifacts@v4
        with:
          name: compiled-rom
          path: "*.gba"
