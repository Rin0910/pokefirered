name: Build GBA ROM

on:
  push:
    branches: [ edit, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi build-essential libpng-dev

      - name: Compile Pokémon ROM
        run: |
          make modern -j$(nproc)

      - name: Upload GBA ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokefirered-Custom-ROM
          path: baserom.gba
